<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zoom test example</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form>
        <fieldset>
            <legend>Account Preferences</legend>

            <div>
                <input type="checkbox" id="updates">
                <label for="updates">I would like to receive weekly product update emails and occasional promotional offers</label>
            </div>

            <div>
                <input type="radio" name="contact" id="email" required>
                <label for="email">Email</label>

                <input type="radio" name="contact" id="sms" required>
                <label for="sms">SMS</label>
            </div>

            <button type="submit">Save preferences</button>
        </fieldset>
    </form>
</body>
</html>
