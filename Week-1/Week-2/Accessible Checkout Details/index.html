<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Checkout Details Static</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Accessible Checkout Details Static</h1>
    </header>

    <main>
        <section class="checkout-details">
            <form action="">
                <fieldset>
                    <legend>
                        <h3>Checkout Details</h3>
                    </legend>

                    <div class="form-card errors">
                        <p>Needed:</p>
                        <ul>
                            <li class="error">Postal Code</li>
                            <li class="error">Recipient</li>
                            <li class="error`">Address</li>
                        </ul>
                    </div>

                    <div class="form-card recipient">
                        <label for="recipient">Recipient Name</label>
                        <input type="text" name="recipient" id="recipient" required autocomplete="name">
                    </div>

                    <div class="form-card address">
                        <label for="address">Address</label>
                        <textarea type="text" name="address" id="address" required autocomplete="address"
                            placeholder="Enter Address"></textarea>
                    </div>

                    <div class="form-card city">
                        <label for="cities">City</label>

                        <select name="cities" id="cities">
                            <option value="" selected>select option</option>
                            <option value="hyderabad">Hyderabad</option>
                            <option value="chennai">Chennai</option>
                            <option value="benguluru">Benguluru</option>
                            <option value="andhra">Andhra Pradesh</option>
                        </select>
                    </div>

                    <div class="form-card post">
                        <label for="post">Postal Code</label>
                        <input type="number" name="post" id="post" required autocomplete="postal-code">
                    </div>

                    <div class="form-card phone-number">
                        <label for="phone">Phone Number</label>
                        <input type="tel" name="phone" id="phone" autocomplete="tel">
                    </div>

                    <div class="form-card delivery">
                        <h3>Delivery</h3>
                        <div class="radio-btn">
                            <input type="radio" name="delivery" id="standard">
                            <label for="standard">Standard</label>
                        </div>

                        <div class="radio-btn">
                            <input type="radio" name="delivery" id="next-day">
                            <label for="next-day">Next Day</label>
                        </div>
                    </div>

                    <button type="submit">Continue</button>
                </fieldset>
            </form>
        </section>

        <section class="order-summary">
            <h3>Order Summary</h3>
            <div class="container">

                <div>
                    <span>Order Placed By</span>
                    <span>Lauren</span>
                </div>

                <div class="item">
                    <span>Desk Lamp</span>
                    <span>£28.00</span>
                </div>

                <div class="delivery-cost">
                    <span>Delivery</span>
                    <span>£4.00</span>
                </div>

                <div class="total">
                    <span>Total</span>
                    <span>£32.00</span>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>@Created by Tempest for Learning Purpose</p>
    </footer>

</body>

</html>
