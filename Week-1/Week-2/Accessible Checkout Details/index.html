<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Checkout Details Static</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Accessible Checkout Details Static</h1>
    </header>

    <main>
        <section class="details">
            <form action="">
                <fieldset>
                    <legend>
                        <h3>Checkout Details</h3>
                    </legend>

                    <div class="errors">
                        <p>Needed:</p>
                        <p class="error">Postal Code</p>
                        <p class="error">Recipient</p>
                        <p class="error">Address</p>
                    </div>
                </fieldset>
            </form>
        </section>
    </main>

</body>

</html>
