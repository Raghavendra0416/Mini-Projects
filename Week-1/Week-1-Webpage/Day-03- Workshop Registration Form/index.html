<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regestration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form>
        <fieldset>
            <legend>Register for the weekend workshop</legend>

            <div class="contact-details">
                <h3>Contact Details</h3>

                <div class="name-email">
                    <div>
                        <label for="name">Full Name:</label>
                        <input type="text" name="name" id="name">
                    </div>

                    <div>
                        <label for="email">Email:</label>
                        <input type="email" name="email">
                    </div>
                </div>

                <p>We will send your booking here.</p>
            </div>



            <div class="session">
                <h3>Choose a session</h3>
                <div class="diff-inputs">
                    <div>
                        <input type="radio" id="saturday">
                        <label for="saturday">Saturday</label>

                        <input type="radio" id="sunday">
                        <label for="sunday">Sunday</label>
                    </div>

                    <div class="expirence-dietary">
                        <div>
                            <label for="expirence">Expirence</label>
                            <select name="expirence" id="expirence">
                                <option value="beginner">Beginner</option>
                                <option value="intermediate">Intermediate</option>
                                <option value="expirenced">Expirenced</option>
                            </select>
                        </div>


                        <div>
                            <label for="dietary">Dietary notes</label>
                            <textarea name="dietary" id="dietary">Please Enter text here...</textarea>
                        </div>
                    </div>

                    <div>
                        <input type="checkbox" name="terms" id="terms">
                        <label for="terms">I agree to the terms</label>
                    </div>
                </div>
            </div>


            <div class="btns">
                <button type="submit">Register</button>
                <button>Reset</button>
            </div>
        </fieldset>
    </form>
</body>

</html>
