<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter and tax factory</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Counter and tax factory</h1>

    <main>
        <section class="cards">
            <!-- Card 1 -->
            <div class="card">
                <h3>Counter A</h3>
                <p>Count: <span id="countA">0</span></p>
                <button id="counterA">Add One</button>
            </div>
            <!-- Card 2 -->
            <div class="card">
                <h3>Counter B</h3>
                <p>Count: <span id="countB">1</span></p>
                <button id="counterB">Add One</button>
            </div>
        </section>

        <section class="display-data">
            <div class="table-scroll">
                <table>
                    <caption>Tax Factory Proof</caption>
                    <thead>
                        <tr>
                            <th>Rate</th>
                            <th>Price</th>
                            <th>Gross</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td class="rate">No Data</td>
                            <td class="price">No Data</td>
                            <td class="gross">Nodata</td>
                        </tr>

                        <tr>
                            <td class="rate">No Data</td>
                            <td class="price">No Data</td>
                            <td class="gross">Nodata</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="./counter.js"></script>
    <script src="./taxCalculations.js"></script>
</body>

</html>
