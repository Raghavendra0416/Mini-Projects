<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form>
        <fieldset>
            <legend>Register for the weekend workshop</legend>

            <section class="group">
                <h3>Contact Details</h3>

                <div class="row">
                    <div class="field">
                        <label for="name">Full Name:</label>
                        <input type="text" name="name" id="name">
                    </div>

                    <div class="field">
                        <label for="email">Email:</label>
                        <input type="email" name="email" id="email">
                    </div>
                </div>

                <p class="hint">We will send your booking here.</p>
            </section>

            <section class="group">
                <h3>Choose a session</h3>

                <div class="row radios">
                    <label><input type="radio" name="session" id="saturday" value="saturday"> Saturday</label>
                    <label><input type="radio" name="session" id="sunday" value="sunday"> Sunday</label>
                </div>

                <div class="row">
                    <div class="field">
                        <label for="experience">Experience</label>
                        <select name="experience" id="experience">
                            <option value="beginner">Beginner</option>
                            <option value="intermediate">Intermediate</option>
                            <option value="experienced">Experienced</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="dietary">Dietary notes</label>
                        <textarea name="dietary" id="dietary" placeholder="Please enter text here..."></textarea>
                    </div>
                </div>

                <label class="checkbox">
                    <input type="checkbox" name="terms" id="terms">
                    I agree to the terms
                </label>
            </section>

            <div class="row btns">
                <button type="submit">Register</button>
                <button type="reset">Reset</button>
            </div>
        </fieldset>
    </form>
</body>

</html>
